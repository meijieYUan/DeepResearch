services:
  mysql:
    image: mysql:8.0
    container_name: superassistant-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: superassistant
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: superassistant-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
      # healthcheck 用的 etcdctl 走 v3 API
      ETCDCTL_API: "3"
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://localhost:2379", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    # 原官方镜像 minio/minio:RELEASE.2023-03-20T20-16-18Z 已从 Docker Hub 下架
    # （仓库不存在，无法拉取），改用社区维护的同款官方 MinIO 二进制镜像
    # pgsty/minio（entrypoint、命令、curl 与官方镜像一致，可直接替换）。
    # 注意：该版本比原 pin 新；当前环境无既有数据卷，可直接使用。若以后升级
    # 已存在数据的 minio-data volume，仍需先确认数据布局/元数据兼容性。
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: superassistant-minio
    restart: unless-stopped
    environment:
      # 新版 MinIO 使用 MINIO_ROOT_USER / MINIO_ROOT_PASSWORD（旧的
      # MINIO_ACCESS_KEY / MINIO_SECRET_KEY 已废弃）。
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s

  milvus:
    image: milvusdb/milvus:v2.4.15
    container_name: superassistant-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      # 与 minio 服务共用同一组凭据，避免改密码后 Milvus 连不上对象存储
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      # 9090:19530 被应用侧 VectorConfig 硬编码依赖，本阶段保持不变
      - "9090:19530"
      - "9091:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 30s

volumes:
  mysql-data:
  etcd-data:
  minio-data:
  milvus-data:
