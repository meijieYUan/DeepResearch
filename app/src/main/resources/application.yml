spring:
  application:
    name: super-assistant-app

  autoconfigure:
    exclude:
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeMultimodalEmbeddingAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeChatAutoConfiguration

  ai:
    dashscope:
      api-key: ${EMBEDDING_KEY}

    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7

    mcp:
      client:
        enabled: true
        name: super-assistant
        version: 1.0.0
        type: SYNC
        toolcallback:
          enabled: true
        sse:
          connections:
            email-server:
              url: http://localhost:8081
              sse-endpoint: /sse

  datasource:
    url: jdbc:mysql://localhost:3306/superassistant
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

server:
  port: 8080

rag:
  retrieval:
    vector:
      top-k: 5
      similarity-threshold: 0.7
    bm25:
      top-k: 10
      index-path: ./data/bm25-index
    fusion:
      top-k: 20
      rrf-k: 60
  rerank:
    enabled: true
    top-k: 5

agent:
  checkpoint-retention:
    retention-days: 30
    max-per-thread: 20
    active-grace-hours: 24
    cron: "0 0 3 * * *"
  compact:
    # 上下文压缩：动态阈值 = (模型窗口 - 输出预留 - 系统/工具/用户上下文预留) × 比例
    # 模型上下文窗口（tokens），deepseek-chat 默认 128K
    model-context-window-tokens: 128000
    # 为模型输出预留的窗口（tokens）
    output-reserve-tokens: 8000
    # 为系统提示词 + 工具定义 + 注入的用户上下文/记忆/MCP 说明预留的窗口（tokens）
    system-prompt-reserve-tokens: 12000
    # 触发 L1-L3 压缩的可用预算比例（0~1）
    warning-ratio: 0.70
    # 触发全量 LLM 压缩的可用预算比例（0~1，需大于 warning-ratio）
    critical-ratio: 0.90
    # 两次全量压缩之间最少间隔的 agent 调用次数
    cooldown-calls: 5
    # 每个线程保留的全量压缩快照数量
    snapshot-keep: 5
  guard:
    # 模型调用异常兜底（重试 + 兜底回答）
    model-retry:
      max-attempts: 3
      initial-delay-ms: 500
      max-delay-ms: 8000
      backoff-multiplier: 2.0
    # 工具调用异常兜底（重试 + 优雅降级）
    tool-retry:
      max-retries: 2
      initial-delay-ms: 300
      max-delay-ms: 3000
      backoff-factor: 2.0
    # 防死循环
    loop:
      max-model-calls-per-run: 15
      max-model-calls-per-thread: 60
      max-total-tool-calls: 60
      max-identical-calls: 3
